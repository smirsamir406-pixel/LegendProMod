name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r11c-linux-x86_64.zip
          unzip -q ndk.zip
          ./android-ndk-r11c/ndk-build NDK_PROJECT_PATH=. NDK_APPLICATION_MK=Application.mk APP_BUILD_SCRIPT=Android.mk
      - uses: actions/upload-artifact@v4
        with:
          name: libclient
          path: libs/armeabi-v7a/libclient.so
