
name: MCPE 0.15.10 FPS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;25.2.9519653"

      - name: Build ARMv7
        shell: bash
        run: |
          set -e
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            NDK_OUT=build/obj \
            NDK_LIBS_OUT=build/libs

      - name: Upload Library
        uses: actions/upload-artifact@v4
        with:
          name: MCPE-FPS-ARMv7
          path: build/libs/**/*.so
          if-no-files-found: error

